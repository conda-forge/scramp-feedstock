context:
  name: scramp
  version: "1.4.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b0858238c6966231b65124a50b06a104e41f2306f22ba7fad77f68f9e336fa3d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - versioningit
  run:
    - python >=${{ python_min }},<4.0
    - asn1crypto >=1.5.1

tests:
  - python:
      imports:
        - scramp
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - python -c "import scramp; print(scramp.__version__)"

about:
  homepage: https://codeberg.org/tlocke/scramp
  license: MIT
  license_file: LICENSE
  summary: A pure-Python implementation of the SCRAM authentication protocol
  description: |
    A Python implementation of the SCRAM authentication protocol defined by
    RFC 5802 and RFC 7677.

extra:
  recipe-maintainers:
    - nicolas-geniteau
    - maximerihouey
    - ncolomer
    - xylar
