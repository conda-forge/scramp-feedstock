context:
  name: scramp
  version: "1.5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 21b88a54bc4b656f57de9f0f6be531ca99f7efe49220bbd083b84cf88748e395

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.32.4
    - versioningit >=3.3.0
  run:
    - python >=${{ python_min }},<4.0
    - asn1crypto >=1.5.1

tests:
  - python:
      imports:
        - scramp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -c "import scramp; print(scramp.__version__)"

about:
  homepage: https://codeberg.org/tlocke/scramp
  license: MIT
  license_file: LICENSE
  summary: A pure-Python implementation of the SCRAM authentication protocol
  description: |
    A Python implementation of the SCRAM authentication protocol defined by
    RFC 5802 and RFC 7677.

extra:
  recipe-maintainers:
    - nicolas-geniteau
    - maximerihouey
    - ncolomer
    - xylar
